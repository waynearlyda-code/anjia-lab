<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1422">
<title>安家 Lab · 3D 户型工作室</title>
<style>
:root{--bg:#eef1f6;--panel:rgba(255,255,255,.86);--line:rgba(20,30,50,.09);--ink:#162033;--sub:#69728a;--acc:#3b6cff;--acc2:#8b5cf6;--grad:linear-gradient(135deg,#3b6cff,#8b5cf6);--r:14px;--sh:0 10px 30px rgba(20,30,60,.12);--top:56px;--tools:46px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:grid;grid-template-rows:var(--top) auto 1fr;grid-template-columns:auto 1fr auto}
/* 顶栏 */
#top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;background:#0f1422;color:#fff;position:relative;z-index:20;padding-top:env(safe-area-inset-top)}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-style:normal;font-weight:800;box-shadow:0 0 18px rgba(99,102,241,.6)}
.logo b{font-size:15px;letter-spacing:.5px;white-space:nowrap}.logo small{display:block;font-size:11px;color:#93a0bd;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:11px;padding:3px;margin:0 auto}
.seg button{padding:6px 14px;border-radius:8px;color:#b9c2d8;font-weight:600;font-size:13px;white-space:nowrap;transition:.2s}
.seg button.on{background:#fff;color:#0f1422;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.tb{display:flex;gap:4px;align-items:center}
.tb button{height:34px;padding:0 10px;border-radius:9px;color:#d5dbea;display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.tb button:hover{background:rgba(255,255,255,.1)}.tb button.on{background:rgba(99,132,255,.25);color:#fff}
.tb .sep{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 4px}
/* 工具条 */
#tools{grid-column:1/-1;display:flex;align-items:center;gap:4px;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;z-index:5}
#tools::-webkit-scrollbar{display:none}
#tools button{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;color:#3c4659;font-weight:500;white-space:nowrap;transition:.15s}
#tools button:hover{background:#f1f4fa}#tools button.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(80,90,255,.35)}
#tools .sp{flex:1}#tools .hint{color:var(--sub);font-size:12px;white-space:nowrap;padding-right:6px}
body.m3d #tools,body.mwalk #tools{display:none}
/* 侧栏 */
#lib,#stage,#props{grid-row:3}
aside{width:248px;background:#fff;border-right:1px solid var(--line);overflow:auto;z-index:4}
#props{border-right:0;border-left:1px solid var(--line);width:280px}
.sec{padding:14px 14px 6px}.sec h4{margin:0 0 10px;font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}.tabs button{padding:4px 10px;border-radius:20px;background:#f1f4fa;font-size:12px;color:#4a5568}.tabs button.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;background:#f6f8fc;border:1px solid transparent;font-size:11px;color:#3c4659;cursor:grab;transition:.15s;text-align:center;line-height:1.2}
.card:hover{border-color:#c9d6ff;background:#eef3ff;transform:translateY(-1px)}
.card canvas{width:56px;height:44px}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:#4a5568}
.sw button span{width:100%;aspect-ratio:1;border-radius:10px;background-size:cover;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw button.on span{border-color:var(--acc);box-shadow:0 0 0 3px rgba(59,108,255,.2)}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row label{width:64px;color:var(--sub);font-size:12px;flex:none}
.row input[type=text],.row input[type=number],.row select{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#f8fafd}
input[type=range]{flex:1;accent-color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;background:#f1f4fa;font-weight:600;font-size:13px;color:#2a3448}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(80,90,255,.3)}.btn.red{background:#fdecec;color:#d23c3c}.btn.full{width:100%;margin-top:6px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}.kv span{color:var(--sub)}
.empty{color:var(--sub);font-size:13px;padding:24px 14px;text-align:center;line-height:1.8}
/* 舞台 */
#stage{position:relative;overflow:hidden;display:flex;min-width:0;min-height:0}
#v2d,#v3d{position:relative;flex:1;min-width:0;min-height:0}
#v2d{background:radial-gradient(circle at 50% 40%,#fbfcfe,#eef1f6)}
#v2d canvas{position:absolute;inset:0;touch-action:none}
#v3d canvas{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:none;outline:none}
body.m2d #v3d,body.m3d #v2d,body.mwalk #v2d{display:none}
body.msplit #v2d{border-right:1px solid var(--line)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.lbl3{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;padding:4px 9px;border-radius:9px;background:rgba(15,20,34,.72);color:#fff;font-size:11px;line-height:1.25;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.lbl3 span{opacity:.75;font-size:10px}.note3{background:rgba(255,190,40,.92);color:#3d2e00}
.vtag{position:absolute;left:12px;top:10px;z-index:3;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--sub);background:rgba(255,255,255,.8);padding:3px 8px;border-radius:6px;pointer-events:none}
.vbtns{position:absolute;right:12px;bottom:12px;z-index:3;display:flex;flex-direction:column;gap:6px}
.vbtns button{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.92);box-shadow:var(--sh);font-size:15px;display:grid;place-items:center}
#v3d .vbtns{bottom:auto;top:12px}
/* 浮动面板 */
.float{position:absolute;right:14px;top:calc(var(--top) + var(--tools) + 14px);width:320px;max-height:calc(100% - var(--top) - var(--tools) - 28px);overflow:auto;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:18px;box-shadow:0 20px 50px rgba(15,20,40,.22);border:1px solid rgba(255,255,255,.7);z-index:30;padding:16px;display:none}
body.m3d .float,body.mwalk .float{top:calc(var(--top) + 14px);max-height:calc(100% - var(--top) - 28px)}
.float.show{display:block;animation:pop .22s ease}
.float h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}.float h3 .x{margin-left:auto;width:28px;height:28px;border-radius:8px;background:#f1f4fa;font-size:14px}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips button{padding:5px 10px;border-radius:20px;background:#f1f4fa;font-size:12px}.chips button.on{background:var(--ink);color:#fff}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.stat div{background:#f6f8fc;border-radius:12px;padding:8px 10px}.stat b{display:block;font-size:16px}.stat span{font-size:11px;color:var(--sub)}
.legend{height:8px;border-radius:4px;background:linear-gradient(90deg,#5b6b8c,#5b8cff,#40c8aa,#ffc43d,#ff6347);margin:6px 0 2px}
.bars div{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}.bars i{height:8px;border-radius:4px;background:var(--grad);display:block}.bars span{width:58px;flex:none;color:#3c4659}.bars em{font-style:normal;color:var(--sub);width:46px;text-align:right;flex:none}
.style-card{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:#f6f8fc;margin:8px 0;width:100%;text-align:left;border:2px solid transparent}
.style-card.on{border-color:var(--acc);background:#eef3ff}.style-card .pal{display:flex;gap:3px}.style-card .pal i{width:16px;height:30px;border-radius:5px;display:block}
.style-card b{display:block;font-size:14px}.style-card small{color:var(--sub);font-size:11.5px}
.tog{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.sw2{width:42px;height:24px;border-radius:12px;background:#d5dae4;position:relative;transition:.2s;flex:none}.sw2::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw2.on{background:var(--acc)}.sw2.on::after{left:21px}
.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.scenes button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:#f6f8fc;font-size:12px}.scenes button b{font-size:20px}
/* 模态 */
#modal{position:fixed;inset:0;background:rgba(10,14,24,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}#modal .box{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .25s}
#modal img{max-width:100%;border-radius:12px;display:block;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--sub);font-weight:600;font-size:12px}
.ok{color:#16a34a;font-weight:700}.warn{color:#d97706;font-weight:700}
/* 提示 */
#toast{position:fixed;left:50%;top:calc(var(--top) + 60px);transform:translateX(-50%) translateY(-10px);background:rgba(15,20,34,.9);color:#fff;padding:9px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
/* 漫游 HUD */
#hud{position:absolute;inset:0;pointer-events:none;display:none;z-index:6}body.mwalk #hud{display:block}
#hud .hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(15,20,34,.72);color:#fff;font-size:12px;padding:8px 14px;border-radius:12px;white-space:nowrap}
#hud .acts{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:auto}
#hud .acts button{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:var(--sh);font-size:13px;font-weight:700;color:#162033}
#hud .acts .row2{display:flex;gap:10px}
#hud .top{position:absolute;left:12px;top:12px;display:flex;gap:8px;pointer-events:auto}
#hud .top button{height:36px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.9);box-shadow:var(--sh);font-weight:600;font-size:13px}
#hud .top button.on{background:var(--ink);color:#fff}
#joy{position:absolute;left:0;bottom:0;width:50%;height:60%;pointer-events:auto;touch-action:none;display:none}
.mob #joy{display:block}.mob #hud .hint{display:none}
#joyk{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);display:none;backdrop-filter:blur(3px)}
#joyk i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.25)}
#look{position:absolute;right:0;top:0;width:50%;height:100%;pointer-events:auto;touch-action:none;display:none}.mob #look{display:block}
/* 全景 HUD */
#pano{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:none;gap:8px;z-index:6;flex-wrap:wrap;justify-content:center}
body.mpano #pano{display:flex}#pano button{height:38px;padding:0 14px;border-radius:11px;background:rgba(255,255,255,.92);box-shadow:var(--sh);font-weight:600;font-size:13px}
body.mpano .vbtns,body.mwalk .vbtns{display:none}
/* 开场 */
#intro{position:fixed;inset:0;z-index:100;background:#0b0f1a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .8s}
#intro.hide{opacity:0;pointer-events:none}
#intro .stage{position:relative;width:min(560px,86vw);aspect-ratio:4/3;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(60,80,255,.25)}
#intro img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.6) brightness(.85)}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro .scan{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#6ea8ff,#b48cff,transparent);box-shadow:0 0 24px 6px rgba(110,140,255,.6);top:0;animation:scan 1.6s ease-in-out 2}
@keyframes scan{0%{top:0}50%{top:100%}100%{top:0}}
#intro .steps{margin-top:22px;font-size:14px;color:#9fb0d0;min-height:120px;width:min(560px,86vw)}
#intro .steps div{display:flex;gap:10px;align-items:center;margin:6px 0;opacity:0;transform:translateY(6px);transition:.35s}
#intro .steps div.on{opacity:1;transform:none}#intro .steps b{color:#fff;font-weight:600}#intro .steps em{font-style:normal;margin-left:auto;color:#7cf0b3;font-variant-numeric:tabular-nums}
#intro h1{font-size:20px;margin:0 0 18px;letter-spacing:1px;font-weight:700}#intro h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#intro .skip{position:absolute;right:18px;top:calc(18px + env(safe-area-inset-top));color:#6f7c99;font-size:13px}
@media (max-width:1280px) and (min-width:821px){aside{width:210px}#props{width:240px}.grid{grid-template-columns:repeat(2,1fr)}}
/* 手机 */
.mob-only{display:none}
@media (max-width:820px){
  :root{--top:52px;--tools:0px}
  #app{grid-template-columns:1fr;grid-template-rows:var(--top) 1fr auto}
  #top{padding:0 10px;gap:8px;padding-top:env(safe-area-inset-top)}
  .logo small,.tb .lbl,.desk-only{display:none!important}.mob-only{display:flex}
  .seg{margin:0 0 0 auto}.seg button{padding:6px 9px;font-size:12px}
  #tools{grid-row:3;grid-column:1;border-top:1px solid var(--line);border-bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}
  #tools button{flex-direction:column;height:auto;padding:5px 9px;gap:1px;font-size:11px}#tools button em{font-style:normal;font-size:17px}
  body.m3d #tools{display:flex}body.mwalk #tools,body.mpano #tools{display:none}
  #lib,#props{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:58vh;border:0;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  #lib.open,#props.open{transform:none}
  .sheet-h{display:flex!important;justify-content:center;padding:8px 0 0}.sheet-h i{width:40px;height:5px;border-radius:3px;background:#d5dae4}
  #stage{grid-row:2!important;flex-direction:column}
  body.msplit #v2d{border-right:0;border-bottom:1px solid var(--line)}
  .float{left:10px;right:10px;width:auto;top:auto!important;bottom:calc(76px + env(safe-area-inset-bottom));max-height:62vh!important;border-radius:20px}
  .grid{grid-template-columns:repeat(4,1fr)}
  #hud .top{right:12px;flex-wrap:wrap}#hud .top button{height:32px;padding:0 9px;font-size:12px}
  .float{max-height:46vh!important}
  #tools .hint,#tools .sp{display:none}
}
.sheet-h{display:none}
</style>
</head>
<body class="m3d">
<div id="intro">
  <button class="skip" id="skip">跳过 ›</button>
  <h1>安家 Lab · <span>一张户型图 → 一个家</span></h1>
  <div class="stage"><img id="introImg" alt=""><canvas id="introCv"></canvas><div class="scan"></div></div>
  <div class="steps" id="steps"></div>
</div>
<div id="app">
  <header id="top">
    <div class="logo"><i>安</i><div><b>安家 Lab</b><small>四室两厅两卫 · 套内约 108㎡ · 南北通透</small></div></div>
    <div class="seg" id="modes">
      <button data-m="2d">平面</button><button data-m="split">分屏</button><button data-m="3d" class="on">3D</button><button data-m="walk">漫游</button>
    </div>
    <div class="tb desk-only">
      <button id="bUndo" title="撤销 ⌘Z">↶</button><button id="bRedo" title="重做 ⇧⌘Z">↷</button><span class="sep"></span>
      <button data-p="check">✅ <span class="lbl">自查</span></button>
      <button data-p="sun">☀️ <span class="lbl">日照</span></button>
      <button data-p="style">🎨 <span class="lbl">风格</span></button>
      <button data-p="smart">🏠 <span class="lbl">中控</span></button>
      <button data-p="shot">📷 <span class="lbl">出图</span></button>
      <button data-p="menu">⋯</button>
    </div>
  </header>
  <nav id="tools"></nav>
  <aside id="lib"><div class="sheet-h"><i></i></div><div id="libBody"></div></aside>
  <main id="stage">
    <div id="v2d"><span class="vtag">平面 · 2D</span><canvas id="cv2"></canvas>
      <div class="vbtns"><button id="fit2" title="适应屏幕">⤢</button><button id="ref2" title="原图对照">🖼</button></div></div>
    <div id="v3d"><span class="vtag" id="tag3">3D · 鸟瞰</span><div id="labels"></div>
      <div class="vbtns"><button data-v="iso" title="斜视">◩</button><button data-v="top" title="俯视">⬒</button><button id="bLbl" title="房间名">🏷</button><button id="bPath" title="太阳轨迹">☀</button></div>
      <div id="hud">
        <div class="top"><button id="wExit">← 退出漫游</button><button id="wCat" class="on">🐈 猫猫</button><button id="wMan">🧍 小人</button><button id="wView">👁 第一人称</button></div>
        <div id="joy"><div id="joyk"><i></i></div></div><div id="look"></div>
        <div class="acts"><div class="row2"><button id="wAct">开门<br>开灯</button></div><button id="wJump" style="width:72px;height:72px;font-size:15px">跳</button></div>
        <div class="hint">WASD / 方向键 移动 · 拖动鼠标转视角 · 空格 跳 · E 开门开灯 · V 切换视角 · Shift 跑 · Esc 退出</div>
      </div>
      <div id="pano"><button id="pPrev">‹ 上一间</button><span id="pName" style="align-self:center;background:rgba(15,20,34,.75);color:#fff;padding:8px 12px;border-radius:10px;font-size:13px"></span><button id="pNext">下一间 ›</button><button id="pGyro" class="mob-only">📱 体感</button><button id="pSave">💾 导出全景图</button><button id="pExit">退出</button></div>
    </div>
  </main>
  <aside id="props"><div class="sheet-h"><i></i></div><div id="propBody"></div></aside>
</div>
<div class="float" id="fp"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script>/*THREE*/</script>
<script>/*APP*/</script>
</body>
</html>
